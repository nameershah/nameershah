<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Muhammad Nameer Shah profile banner (light)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#e9f1ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <clipPath id="photoClip">
      <circle cx="200" cy="210" r="130"/>
    </clipPath>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect x="35" y="35" width="1130" height="350" rx="24" fill="#ffffff" opacity="0.9"/>

  <circle cx="200" cy="210" r="138" fill="url(#accent)" opacity="0.2"/>
  <g clip-path="url(#photoClip)">
    <image href="https://github.com/user-attachments/assets/6fdb8cf2-3d27-48a7-9776-5d4bd21cde31" x="70" y="80" width="260" height="260" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <circle cx="200" cy="210" r="130" fill="none" stroke="#2563eb" stroke-width="5" opacity="0.55"/>

  <text x="380" y="145" font-size="48" font-family="Segoe UI, Inter, Arial, sans-serif" fill="#0f172a" font-weight="700">Muhammad Nameer Shah</text>
  <text x="380" y="190" font-size="28" font-family="Segoe UI, Inter, Arial, sans-serif" fill="#2563eb" font-weight="600">AI Engineer | Agentic &amp; Multimodal Systems</text>
  <rect x="380" y="210" width="560" height="3" fill="url(#accent)"/>

  <text x="380" y="255" font-size="22" font-family="Segoe UI, Inter, Arial, sans-serif" fill="#334155">Focus: Agentic AI Systems, RAG, Multimodal AI Applications</text>
  <text x="380" y="292" font-size="21" font-family="Segoe UI, Inter, Arial, sans-serif" fill="#475569">Education: Computer Science</text>
  <text x="380" y="326" font-size="21" font-family="Segoe UI, Inter, Arial, sans-serif" fill="#475569">Location: Pakistan</text>
  <text x="380" y="360" font-size="21" font-family="Segoe UI, Inter, Arial, sans-serif" fill="#475569">Portfolio: nameershah.github.io/portfolio</text>
</svg>
