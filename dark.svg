<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Muhammad Nameer Shah profile banner (dark)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="photoClip">
      <circle cx="200" cy="210" r="130"/>
    </clipPath>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect x="35" y="35" width="1130" height="350" rx="24" fill="#0b1223" opacity="0.92"/>

  <circle cx="200" cy="210" r="138" fill="url(#accent)" opacity="0.22"/>
  <g clip-path="url(#photoClip)">
    <image href="https://github.com/user-attachments/assets/6fdb8cf2-3d27-48a7-9776-5d4bd21cde31" x="70" y="80" width="260" height="260" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <circle cx="200" cy="210" r="130" fill="none" stroke="#38bdf8" stroke-width="5" opacity="0.8"/>

  <text x="380" y="145" font-size="48" font-family="Segoe UI, Inter, Arial, sans-serif" fill="#f8fafc" font-weight="700">Muhammad Nameer Shah</text>
  <text x="380" y="190" font-size="28" font-family="Segoe UI, Inter, Arial, sans-serif" fill="#38bdf8" font-weight="600">AI Engineer | Agentic &amp; Multimodal Systems</text>
  <rect x="380" y="210" width="560" height="3" fill="url(#accent)"/>

  <text x="380" y="255" font-size="22" font-family="Segoe UI, Inter, Arial, sans-serif" fill="#cbd5e1">Focus: Agentic AI Systems, RAG, Multimodal AI Applications</text>
  <text x="380" y="292" font-size="21" font-family="Segoe UI, Inter, Arial, sans-serif" fill="#94a3b8">Education: Computer Science</text>
  <text x="380" y="326" font-size="21" font-family="Segoe UI, Inter, Arial, sans-serif" fill="#94a3b8">Location: Pakistan</text>
  <text x="380" y="360" font-size="21" font-family="Segoe UI, Inter, Arial, sans-serif" fill="#94a3b8">Portfolio: nameershah.github.io/portfolio</text>
</svg>
