      <circle cx="1012" cy="92" r="1.8" fill="#10B981"><animateTransform attributeName="transform" type="translate" values="0 0;8 16;0 0" dur="5.1s" repeatCount="indefinite"/></circle>
      <circle cx="1094" cy="138" r="2" fill="#06B6D4"><animateTransform attributeName="transform" type="translate" values="0 0;-12 12;0 0" dur="6.8s" repeatCount="indefinite"/></circle>
