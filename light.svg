          <animate attributeName="opacity" from="0" to="1" begin="4.5s" dur="0.25s" fill="freeze"/>
        </g>
        <g class="pill" transform="translate(710 500)">
          <rect width="92" height="30" rx="15" fill="rgba(6,182,212,0.10)" stroke="rgba(37,99,235,0.34)"/>
          <text x="46" y="20" text-anchor="middle">Figma</text>
          <animate attributeName="opacity" from="0" to="1" begin="4.6s" dur="0.25s" fill="freeze"/>
