<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" role="img" aria-label="Muhammad Nameer Shah premium animated profile banner dark theme">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <radialGradient id="glowA" cx="16%" cy="20%" r="54%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
      <animate attributeName="cx" values="16%;22%;16%" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="20%;14%;20%" dur="13s" repeatCount="indefinite"/>
    </radialGradient>

    <radialGradient id="glowB" cx="86%" cy="86%" r="46%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
      <animate attributeName="cx" values="86%;78%;86%" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="86%;74%;86%" dur="15s" repeatCount="indefinite"/>
    </radialGradient>

    <radialGradient id="glowC" cx="62%" cy="30%" r="36%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
      <animate attributeName="cy" values="30%;40%;30%" dur="18s" repeatCount="indefinite"/>
    </radialGradient>

    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#10b981"/>
      <animate attributeName="x1" values="0;1;0" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="asciiGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#22d3ee"/>
      <animate attributeName="x1" values="0;-0.4;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0.6;1" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111b32" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.92"/>
    </linearGradient>

    <linearGradient id="glassHighlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="borderShimmer" x1="-1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="6.5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </linearGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <filter id="asciiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="pillGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.06"/>
      </feComponentTransfer>
    </filter>

    <clipPath id="heroClip">
      <rect x="20" y="20" width="1140" height="570" rx="34"/>
    </clipPath>

    <clipPath id="roleClip1">
      <rect x="526" y="211" width="0" height="30">
        <animate attributeName="width" values="0;250;250;0;0" keyTimes="0;0.12;0.22;0.26;1" dur="16s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="roleClip2">
      <rect x="526" y="211" width="0" height="30">
        <animate attributeName="width" values="0;0;250;250;0;0" keyTimes="0;0.25;0.37;0.47;0.51;1" dur="16s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="roleClip3">
      <rect x="526" y="211" width="0" height="30">
        <animate attributeName="width" values="0;0;250;250;0;0" keyTimes="0;0.5;0.62;0.72;0.76;1" dur="16s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="roleClip4">
      <rect x="526" y="211" width="0" height="30">
        <animate attributeName="width" values="0;0;250;250;0;0" keyTimes="0;0.75;0.87;0.97;1;1" dur="16s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#heroClip)">
    <rect width="1180" height="610" fill="url(#bgGrad)"/>
    <rect width="1180" height="610" fill="url(#glowA)"/>
    <rect width="1180" height="610" fill="url(#glowB)"/>
    <rect width="1180" height="610" fill="url(#glowC)"/>

    <g opacity="0.9">
      <circle cx="130" cy="560" r="2" fill="#67e8f9">
        <animateMotion dur="11s" repeatCount="indefinite" path="M 0 0 C 130 -120 250 -180 360 -320"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1040" cy="520" r="1.8" fill="#a78bfa">
        <animateMotion dur="13s" repeatCount="indefinite" path="M 0 0 C -80 -140 -220 -210 -360 -360"/>
        <animate attributeName="opacity" values="0;0.8;0" dur="13s" repeatCount="indefinite"/>
      </circle>
      <circle cx="880" cy="580" r="1.6" fill="#34d399">
        <animateMotion dur="15s" repeatCount="indefinite" path="M 0 0 C -30 -170 -170 -230 -240 -420"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="15s" repeatCount="indefinite"/>
      </circle>
      <circle cx="320" cy="560" r="1.6" fill="#67e8f9">
        <animateMotion dur="12.5s" repeatCount="indefinite" path="M 0 0 C 90 -120 160 -230 260 -390"/>
        <animate attributeName="opacity" values="0;0.75;0" dur="12.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect width="1180" height="610" filter="url(#noise)" opacity="0.32"/>

    <rect x="20" y="20" width="1140" height="570" rx="34" fill="url(#panelGrad)" opacity="0.18"/>

    <rect x="42" y="48" width="404" height="514" rx="28" fill="#0b1220" fill-opacity="0.72" stroke="rgba(255,255,255,0.1)"/>
    <rect x="470" y="48" width="668" height="514" rx="28" fill="#0f172a" fill-opacity="0.72" stroke="rgba(255,255,255,0.1)"/>

    <path d="M65 82 h340 a24 24 0 0 1 24 24 v40 h-364z" fill="url(#glassHighlight)" opacity="0.5"/>
    <path d="M500 84 h610 a24 24 0 0 1 24 24 v45 h-634z" fill="url(#glassHighlight)" opacity="0.45"/>

    <g transform="translate(0 0)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="6s" repeatCount="indefinite"/>
      <g filter="url(#asciiGlow)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="18" fill="url(#asciiGrad)">
        <text x="72" y="148" opacity="0">        .----.
          <animate attributeName="opacity" values="0;1" begin="0.2s" dur="0.35s" fill="freeze"/>
        </text>
        <text x="72" y="172" opacity="0">      _/      \_
          <animate attributeName="opacity" values="0;1" begin="0.45s" dur="0.35s" fill="freeze"/>
        </text>
        <text x="72" y="196" opacity="0">     /  .--. .--\
          <animate attributeName="opacity" values="0;1" begin="0.7s" dur="0.35s" fill="freeze"/>
        </text>
        <text x="72" y="220" opacity="0">    |  /    Y   |
          <animate attributeName="opacity" values="0;1" begin="0.95s" dur="0.35s" fill="freeze"/>
        </text>
        <text x="72" y="244" opacity="0">    |  \_ 0 | 0 /
          <animate attributeName="opacity" values="0;1" begin="1.2s" dur="0.35s" fill="freeze"/>
        </text>
        <text x="72" y="268" opacity="0">    |    '--^--'
          <animate attributeName="opacity" values="0;1" begin="1.45s" dur="0.35s" fill="freeze"/>
        </text>
        <text x="72" y="292" opacity="0">     \  ._____. /
          <animate attributeName="opacity" values="0;1" begin="1.7s" dur="0.35s" fill="freeze"/>
        </text>
        <text x="72" y="316" opacity="0">      '.___ __.'
          <animate attributeName="opacity" values="0;1" begin="1.95s" dur="0.35s" fill="freeze"/>
        </text>
        <text x="72" y="340" opacity="0">         /_\
          <animate attributeName="opacity" values="0;1" begin="2.2s" dur="0.35s" fill="freeze"/>
        </text>
        <text x="72" y="380" font-size="14" fill="#67e8f9" opacity="0.74">./profile.boot --mode=neon --render=ascii</text>
        <rect x="368" y="369" width="8" height="16" fill="#67e8f9">
          <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
        </rect>
      </g>

      <rect x="56" y="84" width="376" height="56" fill="url(#scanGrad)" opacity="0.32">
        <animate attributeName="y" values="84;494;84" dur="7s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g font-family="Inter, Segoe UI, sans-serif">
      <text x="526" y="120" fill="#f8fafc" font-size="34" font-weight="700">Hi 👋</text>
      <text x="526" y="162" fill="#f8fafc" font-size="40" font-weight="760">I'm Muhammad Nameer Shah</text>

      <rect x="526" y="181" width="410" height="2" fill="url(#accentGrad)"/>

      <text x="526" y="234" fill="#22d3ee" font-size="25" font-weight="600" clip-path="url(#roleClip1)">Frontend Engineer</text>
      <text x="526" y="234" fill="#22d3ee" font-size="25" font-weight="600" clip-path="url(#roleClip2)">Full Stack Developer</text>
      <text x="526" y="234" fill="#22d3ee" font-size="25" font-weight="600" clip-path="url(#roleClip3)">Open Source Contributor</text>
      <text x="526" y="234" fill="#22d3ee" font-size="25" font-weight="600" clip-path="url(#roleClip4)">AI Enthusiast</text>
      <rect x="774" y="214" width="8" height="22" fill="#67e8f9">
        <animate attributeName="opacity" values="1;0;1" dur="0.85s" repeatCount="indefinite"/>
      </rect>

      <g fill="#94a3b8" font-size="17">
        <text x="526" y="279" opacity="0">Location: Pakistan
          <animate attributeName="opacity" begin="1.2s" dur="0.35s" values="0;1" fill="freeze"/>
        </text>
        <text x="526" y="306" opacity="0">Education: BS Software Engineering
          <animate attributeName="opacity" begin="1.5s" dur="0.35s" values="0;1" fill="freeze"/>
        </text>
        <text x="526" y="333" opacity="0">Current Focus: Agentic and Multimodal AI Systems
          <animate attributeName="opacity" begin="1.8s" dur="0.35s" values="0;1" fill="freeze"/>
        </text>
        <text x="526" y="360" opacity="0">Portfolio: nameershah.github.io/portfolio
          <animate attributeName="opacity" begin="2.1s" dur="0.35s" values="0;1" fill="freeze"/>
        </text>
        <text x="526" y="387" opacity="0">Email: smns3960@gmail.com
          <animate attributeName="opacity" begin="2.4s" dur="0.35s" values="0;1" fill="freeze"/>
        </text>
      </g>

      <text x="526" y="428" fill="#f8fafc" font-size="18" font-weight="650">Skills</text>

      <g font-size="14" font-weight="560">
        <g transform="translate(526 442)">
          <rect width="88" height="30" rx="15" fill="#111f3a" stroke="#1e3a5f"/>
          <rect width="88" height="30" rx="15" fill="#22d3ee" opacity="0.2" filter="url(#pillGlow)"/>
          <text x="44" y="20" text-anchor="middle" fill="#dbeafe">React</text>
          <animateTransform attributeName="transform" type="scale" additive="sum" begin="mouseover" end="mouseout" from="1 1" to="1.04 1.04" dur="0.2s" fill="freeze"/>
        </g>
        <g transform="translate(622 442)">
          <rect width="92" height="30" rx="15" fill="#111f3a" stroke="#1e3a5f"/><rect width="92" height="30" rx="15" fill="#a78bfa" opacity="0.2" filter="url(#pillGlow)"/>
          <text x="46" y="20" text-anchor="middle" fill="#dbeafe">Next.js</text>
          <animateTransform attributeName="transform" type="scale" additive="sum" begin="mouseover" end="mouseout" from="1 1" to="1.04 1.04" dur="0.2s" fill="freeze"/>
        </g>
        <g transform="translate(722 442)">
          <rect width="92" height="30" rx="15" fill="#111f3a" stroke="#1e3a5f"/><rect width="92" height="30" rx="15" fill="#34d399" opacity="0.2" filter="url(#pillGlow)"/>
          <text x="46" y="20" text-anchor="middle" fill="#dbeafe">Node.js</text>
          <animateTransform attributeName="transform" type="scale" additive="sum" begin="mouseover" end="mouseout" from="1 1" to="1.04 1.04" dur="0.2s" fill="freeze"/>
        </g>
        <g transform="translate(822 442)">
          <rect width="108" height="30" rx="15" fill="#111f3a" stroke="#1e3a5f"/><rect width="108" height="30" rx="15" fill="#22d3ee" opacity="0.2" filter="url(#pillGlow)"/>
          <text x="54" y="20" text-anchor="middle" fill="#dbeafe">TypeScript</text>
          <animateTransform attributeName="transform" type="scale" additive="sum" begin="mouseover" end="mouseout" from="1 1" to="1.04 1.04" dur="0.2s" fill="freeze"/>
        </g>

        <g transform="translate(526 480)">
          <rect width="98" height="30" rx="15" fill="#111f3a" stroke="#1e3a5f"/><rect width="98" height="30" rx="15" fill="#a78bfa" opacity="0.2" filter="url(#pillGlow)"/>
          <text x="49" y="20" text-anchor="middle" fill="#dbeafe">Tailwind</text>
          <animateTransform attributeName="transform" type="scale" additive="sum" begin="mouseover" end="mouseout" from="1 1" to="1.04 1.04" dur="0.2s" fill="freeze"/>
        </g>
        <g transform="translate(632 480)">
          <rect width="90" height="30" rx="15" fill="#111f3a" stroke="#1e3a5f"/><rect width="90" height="30" rx="15" fill="#34d399" opacity="0.2" filter="url(#pillGlow)"/>
          <text x="45" y="20" text-anchor="middle" fill="#dbeafe">Python</text>
          <animateTransform attributeName="transform" type="scale" additive="sum" begin="mouseover" end="mouseout" from="1 1" to="1.04 1.04" dur="0.2s" fill="freeze"/>
        </g>
        <g transform="translate(730 480)">
          <rect width="90" height="30" rx="15" fill="#111f3a" stroke="#1e3a5f"/><rect width="90" height="30" rx="15" fill="#22d3ee" opacity="0.2" filter="url(#pillGlow)"/>
          <text x="45" y="20" text-anchor="middle" fill="#dbeafe">Docker</text>
          <animateTransform attributeName="transform" type="scale" additive="sum" begin="mouseover" end="mouseout" from="1 1" to="1.04 1.04" dur="0.2s" fill="freeze"/>
        </g>
        <g transform="translate(828 480)">
          <rect width="102" height="30" rx="15" fill="#111f3a" stroke="#1e3a5f"/><rect width="102" height="30" rx="15" fill="#a78bfa" opacity="0.2" filter="url(#pillGlow)"/>
          <text x="51" y="20" text-anchor="middle" fill="#dbeafe">Postgres</text>
          <animateTransform attributeName="transform" type="scale" additive="sum" begin="mouseover" end="mouseout" from="1 1" to="1.04 1.04" dur="0.2s" fill="freeze"/>
        </g>

        <g transform="translate(526 518)">
          <rect width="74" height="30" rx="15" fill="#111f3a" stroke="#1e3a5f"/><rect width="74" height="30" rx="15" fill="#34d399" opacity="0.2" filter="url(#pillGlow)"/>
          <text x="37" y="20" text-anchor="middle" fill="#dbeafe">AWS</text>
          <animateTransform attributeName="transform" type="scale" additive="sum" begin="mouseover" end="mouseout" from="1 1" to="1.04 1.04" dur="0.2s" fill="freeze"/>
